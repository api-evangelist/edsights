aid: edsights
name: EdSights
description: >-
  EdSights is a student voice and engagement platform for higher education. It
  pairs an AI-powered SMS chatbot with real-time analytics to collect continuous
  feedback from students, surface persistence and well-being risk, and flag
  individuals who need staff intervention. Its Student Voice Score (SVS)
  benchmarks student satisfaction the way NPS benchmarks customers, and
  institutional dashboards help retention, advising, and student-success teams
  act on that feedback throughout the academic journey. EdSights serves 290+
  colleges and universities and connects to campus systems — Banner SIS, Slate,
  Salesforce, Starfish, EAB Navigate360, and Pharos — via SFTP data feeds. The
  company is Techstars-backed. As of this profile EdSights exposes no public
  developer API, OpenAPI specification, SDKs, or webhooks; integration is
  data-file (SFTP) based, so most API-artifact enrichment is not applicable.
